plugin: amazon.aws.aws_ec2
regions:
- us-east-1
hostnames:
#- ip-address
- private-ip-address
filters:
  # This selects only running instances with tag `Environment` tag set to `dev`.
  tag:Name: frontend-dev
  instance-state-name : running
compose:
  # This sets the ansible_host variable to connect with the private IP address without changing the hostname.
  ansible_host: private_ip_address
keyed_groups:
  - key: tags.Component
    separator: ''









# ansible-inventory -i frontend.aws_ec2_yaml to run this dynamic inventory file.